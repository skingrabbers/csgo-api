name: Generate locale names

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate
  cancel-in-progress: false

env:
  LANGUAGES: en,zh-CN,pt-BR,es-ES,fr,de,it,nl,sv,tr,ja,pl,ko

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ByMykel/CSGO-API
          ref: main
          path: upstream
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install upstream dependencies
        working-directory: upstream
        run: npm ci --ignore-scripts

      - name: Run upstream generator
        working-directory: upstream
        run: |
          node update.js --force --languages "$LANGUAGES"
          node group.js --force --languages "$LANGUAGES"

      - name: Build name maps
        run: |
          FILE_TRACKER_MANIFEST_ID="$(curl -fsSL https://raw.githubusercontent.com/ByMykel/counter-strike-file-tracker/main/static/manifestId.txt | tr -d '[:space:]')"
          test -n "$FILE_TRACKER_MANIFEST_ID"
          export FILE_TRACKER_MANIFEST_ID
          node build_names.mjs upstream/public/api out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: out
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out

      - name: Publish to generated branch
        run: |
          if git fetch --depth=1 origin generated; then
            git worktree add prev FETCH_HEAD
            if diff -r -x .git prev out; then
              echo "No changes; skipping push."
              exit 0
            fi
          fi
          cd out
          git init -q -b generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Generate names"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" generated
