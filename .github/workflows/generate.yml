name: Generate locale names

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

env:
  LANGUAGES: en,zh-CN,pt-BR,es-ES,fr,de,it,nl,sv,tr,ja,pl,ko

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ByMykel/CSGO-API
          ref: main
          path: upstream
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install upstream dependencies
        working-directory: upstream
        run: npm ci

      - name: Run upstream generator
        working-directory: upstream
        run: |
          node update.js --force --languages "$LANGUAGES"
          node group.js --force --languages "$LANGUAGES"

      - name: Build name maps
        run: |
          FILE_TRACKER_MANIFEST_ID="$(curl -fsSL https://raw.githubusercontent.com/ByMykel/counter-strike-file-tracker/main/static/manifestId.txt | tr -d '[:space:]')"
          test -n "$FILE_TRACKER_MANIFEST_ID"
          export FILE_TRACKER_MANIFEST_ID
          node build_names.mjs upstream/public/api out

      - name: Publish to generated branch
        run: |
          if git fetch --depth=1 origin generated; then
            git worktree add prev FETCH_HEAD
            if diff -r -x .git prev out; then
              echo "No changes; skipping push."
              exit 0
            fi
          fi
          cd out
          git init -q -b generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Generate names"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" generated
